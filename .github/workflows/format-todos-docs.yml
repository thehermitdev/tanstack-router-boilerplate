name: จัดรูปแบบเอกสาร Todos

on:
  push:
    branches:
      - docs/architecture-and-todos-tutorial

permissions:
  contents: write

jobs:
  format-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/architecture-and-todos-tutorial
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install
      - run: bunx prettier --write docs/ARCHITECTURE.md docs/GETTING_STARTED.th.md
      - name: Commit เอกสารที่จัดรูปแบบแล้ว
        run: |
          git add docs/ARCHITECTURE.md docs/GETTING_STARTED.th.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: จัดรูปแบบ Architecture และ Todos Tutorial"
          git push
