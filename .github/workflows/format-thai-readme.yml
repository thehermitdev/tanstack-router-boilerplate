name: จัดรูปแบบ README ภาษาไทย

on:
  push:
    branches:
      - docs/thai-provider-neutral-readme

permissions:
  contents: write

jobs:
  format-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/thai-provider-neutral-readme
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install
      - run: bunx prettier --write README.md
      - name: Commit README ที่จัดรูปแบบแล้ว
        run: |
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: จัดรูปแบบ README ภาษาไทย"
          git push
